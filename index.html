<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>GPS 시뮬레이터</title>

    <style>html, body, #vmap { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }</style>
    <script type="text/javascript" src="https://map.vworld.kr/js/webglMapInit.js.do?version=3.0&apiKey=CBDA8338-FEF2-34AE-9B04-D31B3597153F&domain=https://karng87.github.io/gps"></script>
    <script src=./js/include/Gmobile.js></script>
    <script src=./js/include/Fmobile.js></script>
    <script src=./js/GPSmobile.js></script>
</head>
<body>
    <div id="vmap"></div>
    
    <!-- 💡 [수정] pointer-events를 auto로 변경하여 직접 손가락 스크롤이 가능하도록 수정했습니다. -->
    <div id="debug-log" style="position:fixed; top:10px; left:10px; width:90%; max-height:150px; background:rgba(0,0,0,0.85); color:lime; font-size:11px; font-family:monospace; z-index:99999; overflow-y:auto; padding:8px; border-radius:8px; box-shadow:0 4px 15px rgba(0,0,0,0.5); pointer-events:auto; word-break:break-all;">[📡 모바일 실시간 디버그 로그 시스템 가동]</div>
    
    <!-- 💡 아이폰에서도 한눈에 보이는 대형 자막 전광판 -->
    <div id="location-overlay" style="display: none; position: fixed; top: 25%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.85); color: #fff; padding: 25px 35px; border-radius: 16px; font-family: -apple-system, sans-serif; font-weight: bold; line-height: 1.6; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid rgba(255, 235, 59, 0.4); z-index: 99999; pointer-events: none; width: 80%; max-width: 500px;">
        <div style="color: #ffeb3b; font-size: 16px; letter-spacing: 2px; margin-bottom: 12px; text-transform: uppercase;">📍 확인된 위경도 좌표</div>
        <div id="geo-coord-text" style="font-size: 24px; color: #ffffff; word-break: break-all;">위도: 00.000000<br>경도: 00.000000</div>
        <div style="color: #aaa; font-size: 11px; font-weight: normal; margin-top: 15px; letter-spacing: 0.5px;">(화면을 터치하면 이 창이 닫힙니다)</div>
    </div>

<script>
    // 브라우저의 console.log 및 console.error를 로그 창에 동시 출력하고 강제 하단 스크롤하는 래핑 엔진
    const originalLog = console.log;
    const originalError = console.error;

    // 일반 로그 처리
    console.log = function(...args) {
        originalLog.apply(console, args);
        const el = document.getElementById('debug-log');
        if(el) {
            el.innerHTML += '<br><span style="color:#00ff00;">ℹ️ ' + args.join(' ') + '</span>';
            // 💡 로그가 추가될 때마다 스크롤을 맨 아래로 즉시 내려 최신 로그를 보여줍니다.
            el.scrollTop = el.scrollHeight;
        }
    };

    // 에러 로그 처리 (아이폰 미디어 차단 등의 치명적 에러를 빨간색으로 시각화)
    console.error = function(...args) {
        originalError.apply(console, args);
        const el = document.getElementById('debug-log');
        if(el) {
            el.innerHTML += '<br><span style="color:#ff4444; font-weight:bold;">🚨 ' + args.join(' ') + '</span>';
            el.scrollTop = el.scrollHeight;
        }
    };
</script>
</body>
</html>
