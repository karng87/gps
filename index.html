<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>GPS 시뮬레이터</title>

    <style>html, body, #vmap { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }</style>
    <script type="text/javascript" src="https://map.vworld.kr/js/webglMapInit.js.do?version=3.0&apiKey=C9DC23A4-6E50-3C41-8C1A-349573BA7340&domain=https://karng87.github.io/gps"></script>

    <script src=./js/include/Gmobile.js></script>
    <script src=./js/include/Fmobile.js></script>
    <script src=./js/GPSmobile.js></script>
</head>
<body>
    <div id="vmap"></div>
    <div id="debug-log" style="position:fixed; top:10px; left:10px; width:90%; max-height:150px; background:rgba(0,0,0,0.8); color:lime; font-size:10px; z-index:99999; overflow-y:scroll; padding:5px; pointer-events:none;">[로그 창 가동]</div>

<script>
    // 브라우저의 console.log를 화면 상단 검은 창에 강제로 똑같이 띄워주는 코드
    const originalLog = console.log;
    console.log = function(...args) {
        originalLog.apply(console, args);
        const el = document.getElementById('debug-log');
        if(el) el.innerHTML += '<br>' + args.join(' ');
    };
</script>
</body>
