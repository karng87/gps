<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>GPS 시뮬레이터</title>

    <style>html, body, #vmap { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }</style>
    <script type="text/javascript" src="https://map.vworld.kr/js/webglMapInit.js.do?version=3.0&apiKey=CBDA8338-FEF2-34AE-9B04-D31B3597153F&domain=https://karng87.github.io/gps"></script>
    <script src=./js/include/Gmobile.js></script>
    <script src=./js/include/Fmobile.js></script>
    <script src=./js/GPSmobile.js></script>
</head>
<body>
    <div id="vmap"></div>
    
    <!-- 💡 [수정] pointer-events를 auto로 변경하여 직접 손가락 스크롤이 가능하도록 수정했습니다. -->
    <div id="debug-log" style="position:fixed; top:10px; left:10px; width:90%; max-height:150px; background:rgba(0,0,0,0.85); color:lime; font-size:11px; font-family:monospace; z-index:99999; overflow-y:auto; padding:8px; border-radius:8px; box-shadow:0 4px 15px rgba(0,0,0,0.5); pointer-events:auto; word-break:break-all;">[📡 모바일 실시간 디버그 로그 시스템 가동]</div>
    
    <!-- 💡 pointer-events 제거, 크기 확장, 패딩 조절 완료 -->
    <div id="location-overlay" style="display: none; position: fixed; top: 25%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.9); color: #fff; padding: 30px 45px; border-radius: 20px; font-family: -apple-system, sans-serif; font-weight: bold; line-height: 1.7; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.6); border: 2px solid rgba(255, 235, 59, 0.5); z-index: 99999; width: 85%; max-width: 550px; cursor: pointer;">
        <div style="color: #ffeb3b; font-size: 18px; letter-spacing: 2px; margin-bottom: 15px; text-transform: uppercase;">📍 확인된 위치 정보</div>
        <!-- 고도 정보 출력을 위해 id 내부 구조 유지 -->
        <div id="geo-coord-text" style="font-size: 24px; color: #ffffff; word-break: break-all;">위도: 00.000000<br>경도: 00.000000<br>고도: 0.0m</div>
        <div id="geo-time-text" style="color: #bbb; font-size: 14px; font-weight: normal; margin-top: 15px; letter-spacing: 0.5px;"></div>
        <div style="color: #ffeb3b; font-size: 12px; font-weight: normal; margin-top: 12px; opacity: 0.8; letter-spacing: 0.5px;">【 터치 시 정보 복사 후 닫힙니다 】</div>
    </div>

    <!-- 💡 복사 완료 시 화면 하단에 띄워줄 토스트 팝업 (기본 숨김) -->
    <div id="copy-toast" style="display: none; position: fixed; bottom: 10%; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.85); color: #ffeb3b; padding: 12px 25px; border-radius: 30px; font-family: -apple-system, sans-serif; font-size: 14px; font-weight: bold; z-index: 100000; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 1px solid rgba(255, 235, 59, 0.3); pointer-events: none;">
        📋 주소 정보가 클립보드에 복사되었습니다!
    </div>

<script>

// 브라우저의 console.log 및 console.error를 로그 창에 동시 출력하고 강제 하단 스크롤하는 래핑 엔진
const originalLog = console.log;
const originalError = console.error;

// [설정] 화면에 유지할 최대 로그 개수 (모바일 안정성을 위해 30~50개 추천)
const MAX_LOG_COUNT = 30;

// 로그가 쌓여서 무거워지는 것을 방지하는 관리 함수
function appendDebugLog(htmlMessage) {
    const el = document.getElementById('debug-log');
    if (!el) return;

    // 1. 새로운 로그 추가
    el.innerHTML += htmlMessage;

    // 2. <br> 태그 기준으로 로그 줄 수 계산 (innerHTML 특성 보완)
    const lines = el.innerHTML.split('<br>');
    
    // 3. 설정한 최대 개수를 초과하면 오래된 앞부분 잘라내기
    if (lines.length > MAX_LOG_COUNT) {
        // 첫 번째 라인은 시스템 타이틀([📡 모바일...])이므로 유지하고 그 뒤를 자릅니다.
        const title = lines[0];
        const freshLogs = lines.slice(lines.length - MAX_LOG_COUNT);
        el.innerHTML = title + '<br>' + freshLogs.join('<br>');
    }

    // 4. 스크롤을 맨 아래로 즉시 이동
    el.scrollTop = el.scrollHeight;
}

// 일반 로그 처리
console.log = function(...args) {
    originalLog.apply(console, args);
    appendDebugLog('<br><span style="color:#00ff00;">ℹ️ ' + args.join(' ') + '</span>');
};

// 에러 로그 처리 (아이폰 미디어 차단 등의 치명적 에러를 빨간색으로 시각화)
console.error = function(...args) {
    originalError.apply(console, args);
    appendDebugLog('<br><span style="color:#ff4444; font-weight:bold;">🚨 ' + args.join(' ') + '</span>');
};

</script>
</body>
</html>
